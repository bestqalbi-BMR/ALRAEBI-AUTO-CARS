<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RAC ADMIN V15</title><link rel="stylesheet" href="style.css"><style>body{background:#050913}.a15{max-width:1200px;margin:auto;padding:20px}.panel{background:rgba(16,24,40,.8);border:1px solid rgba(255,255,255,.08);border-radius:22px;padding:20px;margin:14px 0;backdrop-filter:blur(14px)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.form{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.full{grid-column:1/-1}.table{overflow:auto}.table table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px;border-bottom:1px solid #223044;text-align:right}.mini{font-size:12px;opacity:.7}@media(max-width:700px){.grid,.form{grid-template-columns:1fr}}</style></head><body><div class="a15"><div class="panel"><div class="section-label">RAC ADMIN V15 • CLOUD CONTROL</div><h1>لوحة إدارة الراعبي أوتو كارز</h1><p class="mini">إدارة حقيقية عبر API + SQLite — مناسبة للنشر على VPS/Node.</p><input id="api" class="field" placeholder="https://your-domain.com"><div class="form" style="margin-top:10px"><input id="u" class="field" placeholder="اسم المستخدم"><input id="p" class="field" type="password" placeholder="كلمة المرور"></div><button class="btn primary" style="margin-top:10px" onclick="login()">دخول سحابي</button><span id="msg" class="mini"></span></div><div id="app" style="display:none"><div class="grid"><div class="stat"><b id="sCars">0</b><span>السيارات</span></div><div class="stat"><b id="sCus">0</b><span>العملاء</span></div><div class="stat"><b id="sOrd">0</b><span>الطلبات</span></div><div class="stat"><b id="sLead">0</b><span>الاستفسارات</span></div></div><div class="panel"><h2>إضافة سيارة</h2><form class="form" onsubmit="addCar(event)"><input id="name" class="field" required placeholder="اسم السيارة"><input id="brand" class="field" placeholder="الشركة"><input id="type" class="field" placeholder="النوع"><input id="price" class="field" type="number" placeholder="السعر"><input id="stock" class="field" type="number" value="1" placeholder="المخزون"><input id="status" class="field" value="متوفر" placeholder="الحالة"><input id="image" class="field full" placeholder="رابط/مسار الصورة"><textarea id="desc" class="field full" placeholder="الوصف"></textarea><button class="btn primary full">＋ حفظ في قاعدة البيانات</button></form></div><div class="panel"><h2>المخزون</h2><div id="cars" class="table"></div></div><div class="panel"><h2>الطلبات</h2><div id="orders" class="table"></div></div><div class="panel"><h2>العملاء</h2><div id="customers" class="table"></div></div><div class="panel"><h2>الاستفسارات</h2><div id="leads" class="table"></div></div><div class="panel"><button class="btn" onclick="backup()">⬇️ تصدير نسخة احتياطية JSON</button> <button class="btn" onclick="location.href='index.html'">🌐 المتجر</button></div></div></div><script src="api.js"></script><script>const $=id=>document.getElementById(id); function msg(x){$('msg').textContent=x} async function login(){RACAPI.base=$('api').value.trim().replace(/\/$/,'');localStorage.setItem('alraebi_api_url',RACAPI.base);try{await RACAPI.login($('u').value.trim(),$('p').value);$('app').style.display='block';msg('متصل ✓');load()}catch(e){msg('فشل الدخول: '+e.message)}} async function load(){try{let [c,o,u,l,st]=await Promise.all([RACAPI.cars(),RACAPI.orders(),RACAPI.customers(),RACAPI.leads(),RACAPI.request('/api/admin/stats')]);$('sCars').textContent=st.cars;$('sCus').textContent=st.customers;$('sOrd').textContent=st.orders;$('sLead').textContent=st.leads;$('cars').innerHTML=c.map(x=>`<div style="padding:10px;border-bottom:1px solid #223044"><b>${x.name}</b> — ${x.brand} — ${x.price||'حسب الطلب'} <button class="btn red" onclick="delCar(${x.id})">حذف</button></div>`).join('')||'لا توجد سيارات';$('orders').innerHTML=o.map(x=>`<div style="padding:10px;border-bottom:1px solid #223044"><b>${x.car||'طلب'}</b> — ${x.name||''} — ${x.phone||''} — ${x.status}<select onchange="status(${x.id},this.value)"><option>جديد</option><option>تم التواصل</option><option>مكتمل</option><option>ملغي</option></select></div>`).join('')||'لا توجد طلبات';$('customers').innerHTML=u.map(x=>`<div style="padding:10px;border-bottom:1px solid #223044">${x.name} — ${x.phone}</div>`).join('')||'لا يوجد عملاء';$('leads').innerHTML=l.map(x=>`<div style="padding:10px;border-bottom:1px solid #223044">${x.type} — ${x.name} — ${x.phone} — ${x.car||''}</div>`).join('')||'لا توجد استفسارات'}catch(e){msg('خطأ: '+e.message)}} async function addCar(e){e.preventDefault();try{await RACAPI.request('/api/cars',{method:'POST',body:JSON.stringify({name:$('name').value,brand:$('brand').value,type:$('type').value,price:Number($('price').value||0),stock:Number($('stock').value||0),status:$('status').value,image:$('image').value,description:$('desc').value})});e.target.reset();load()}catch(e){msg(e.message)}} async function delCar(id){if(confirm('حذف السيارة؟')){await RACAPI.request('/api/cars/'+id,{method:'DELETE'});load()}} async function status(id,v){await RACAPI.request('/api/orders/'+id,{method:'PATCH',body:JSON.stringify({status:v})});load()} async function backup(){const [c,o,u,l]=await Promise.all([RACAPI.cars(),RACAPI.orders(),RACAPI.customers(),RACAPI.leads()]);const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({cars:c,orders:o,customers:u,leads:l,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'}));a.download='alraebi-v15-backup.json';a.click()}</script>
<style id="rac-v18-style">
.rac-v18-cloud{position:fixed;left:14px;bottom:14px;z-index:9999;padding:10px 14px;border:1px solid #2d4568;border-radius:999px;background:#071326dd;color:#dcecff;backdrop-filter:blur(12px);font:700 12px Arial;box-shadow:0 10px 35px #0008}
.rac-v18-cloud b{color:#63e6ad}.rac-v18-panel{position:fixed;inset:auto 14px 68px 14px;z-index:9998;display:none;max-width:520px;margin:auto;padding:18px;border:1px solid #294466;border-radius:22px;background:#07101fee;color:#fff;backdrop-filter:blur(18px);box-shadow:0 20px 70px #000b;font-family:Arial}
.rac-v18-panel.show{display:block}.rac-v18-panel input,.rac-v18-panel button{padding:11px;border-radius:12px;border:1px solid #314866;background:#0b1628;color:#fff;margin:4px}.rac-v18-panel button{cursor:pointer}.rac-v18-row{display:flex;flex-wrap:wrap;gap:6px}
</style>
<div class="rac-v18-cloud" id="racV18Cloud" onclick="document.getElementById('racV18Panel').classList.toggle('show')">☁️ CLOUD <b id="racV18State">CHECKING</b></div>
<div class="rac-v18-panel" id="racV18Panel">
  <b>ALRAEBI AUTO CARS V18 — CLOUD CONTROL</b>
  <div class="rac-v18-row"><input id="racV18Api" placeholder="/api"><button onclick="racV18Connect()">فحص وربط</button><button onclick="racV18Cars()">تحديث السيارات</button></div>
  <small id="racV18Msg">جاهز</small>
</div>
<script>
(async function(){
 const api=window.RACAPI;
 if(!api)return;
 document.getElementById('racV18Api').value=api.base();
 try{const h=await api.health();document.getElementById('racV18State').textContent=h.version+" ONLINE";document.getElementById('racV18State').style.color="#63e6ad"}catch{document.getElementById('racV18State').textContent="LOCAL";}
})();
async function racV18Connect(){
 const v=document.getElementById('racV18Api').value.trim()||"/api";RACAPI.setBase(v);
 try{const h=await RACAPI.health();document.getElementById('racV18State').textContent=h.version+" ONLINE";document.getElementById('racV18Msg').textContent="السيرفر متصل بنجاح";document.getElementById('racV18Msg').style.color="#63e6ad"}catch(e){document.getElementById('racV18State').textContent="OFFLINE";document.getElementById('racV18Msg').textContent=e.message}}
async function racV18Cars(){try{const x=await RACAPI.cars({limit:100});document.getElementById('racV18Msg').textContent="تم جلب "+x.items.length+" سيارة من السحابة";if(window.renderCars&&typeof renderCars==="function")renderCars(x.items)}catch(e){document.getElementById('racV18Msg').textContent=e.message}}
</script>
</body></html>
